name: Keep schedules alive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. The lead pipelines only write to Google Sheets,
# never to the repo, so on their own they would be switched off silently and
# lead discovery would stop with no error anywhere.
#
# Re-enabling a workflow through the API resets that 60-day clock. This runs
# monthly, comfortably inside the window, and re-enables itself as well as the
# two pipelines so the keepalive can't lapse either. It makes no commits.

on:
  schedule:
    # 03:00 UTC on the 1st of each month.
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in leads-pipeline.yml leads-intl.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "re-enabled $wf"
          done
